<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover so the notch/home-bar insets are reported to CSS
       (env(safe-area-inset-*) keeps the floating tool bar clear of them). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="../favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="../icon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../icon-512.png" />
  <link rel="apple-touch-icon" href="../icon-180.png" />
  <title>Scoubidou3D — strands with depth</title>
  <!-- Set the theme before first paint: anything deferred or bundled lands after
       the page has already painted, and a dark-theme visitor sees a cream flash.
       Shares its key with the studio (src/ui/panel.ts) and site/theme.js. -->
  <script>
    try {
      var t = localStorage.getItem('scoubidou3d-theme');
    } catch (e) {}
    document.documentElement.dataset.theme =
      t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>

</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>
    <aside id="panel"></aside>
  </div>
  <script type="module" src="../src/main.ts"></script>
</body>
</html>
