# Type-check and build on every push / pull request, so a broken build is caught
# before it reaches main (where deploy.yml publishes it).
name: CI

on:
  push:
    branches-ignore: [main] # main is covered by the deploy workflow's build job
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Before the build, because a missing shell fails the build with a
      # rollup path error rather than with the sentence that says what to run.
      - name: The k board pages are in step with the k range
        run: node scripts/ks-board-pages.mjs --check

      - name: The k board's ladder
        run: npm run check:board

      # What /mxn/ may take off the picks shelf. A person's ring drawn under the
      # engine's numbers, or a ✓ valid adopted as though somebody had starred
      # it, both look exactly like a working page.
      - name: The lab's rules for a judged ★ best
        run: npm run check:picks

      # public/ files are served verbatim under stable URLs, so the ?v= key is
      # the only thing stopping a browser running last month's engine against
      # this month's workers. Changing the Python without bumping it is how
      # "module 'bridge' has no attribute fit_plan_now" reached a reader.
      - name: The engine-file key is in step with the Python
        run: npm run check:enginekey

      - name: Type-check and build
        run: npm run build
