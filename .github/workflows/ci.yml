# Type-check and build on every push / pull request, so a broken build is caught
# before it reaches main (where deploy.yml publishes it).
name: CI

on:
  push:
    branches-ignore: [main] # main is covered by the deploy workflow's build job
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Before the build, because a missing shell fails the build with a
      # rollup path error rather than with the sentence that says what to run.
      - name: The k board pages are in step with the k range
        run: node scripts/ks-board-pages.mjs --check

      - name: The k board's ladder
        run: npm run check:board

      # What /mxn/ may take off the picks shelf. A person's ring drawn under the
      # engine's numbers, or a ✓ valid adopted as though somebody had starred
      # it, both look exactly like a working page.
      - name: The lab's rules for a judged ★ best
        run: npm run check:picks

      # Reading a k sequence out of a URL, and what "fixed" means for one level
      # of a stack. `?ks=-1-1-1…` parsed to nothing once, so a ten-level stitch
      # opened as a one-level one and said nothing about it.
      - name: The fitter's ladder, and the ks a URL carries
        run: npm run check:ladder

      # A flag joining a cache key must not move the keys already on the shelf,
      # and the page and the Worker must agree on the shape — a key one writes
      # and the other 400s reads exactly like a network fault.
      - name: The reach cap's key grammar
        run: npm run check:reach

      # Planner + cache-key shapes. A sweep that drops a size, or a client that
      # spells ks in a way the Worker 400s, is an overnight job that looks like
      # it ran and stored nothing. Negative ks (`-1 -1 -1`) go through here.
      - name: The farm planner and cache-key shapes
        run: npm run check:plan

      # The JS -> Python seam, in a real Pyodide off npm. Nothing else in the
      # repo executes it: qa:cache drives the real page but asserts the engine
      # is never woken, and the path that does wake it needs a CDN. A JS null
      # arriving as JsNull rather than None broke every run once, on a green CI.
      - name: The worker-to-engine boundary
        run: npm run check:boundary

      # public/ files are served verbatim under stable URLs, so the ?v= key is
      # the only thing stopping a browser running last month's engine against
      # this month's workers. Changing the Python without bumping it is how
      # "module 'bridge' has no attribute fit_plan_now" reached a reader.
      - name: The engine-file key is in step with the Python
        run: npm run check:enginekey

      - name: Type-check and build
        run: npm run build
