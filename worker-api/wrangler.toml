name = "mxn-solutions-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Deployed separately from the GitHub Pages site. Nothing in the Pages build
# depends on this Worker existing, and the lab keeps working without it.

[[d1_databases]]
binding = "DB"
database_name = "mxn-solutions"
# From `wrangler d1 create mxn-solutions`. Not a secret -- it identifies the
# database, it does not grant access to it; reaching it still needs account
# credentials. Committing it is Cloudflare's own convention, and is what lets a
# fresh clone deploy against the same database instead of a new empty one.
database_id = "776e52b5-44ea-46cb-b5dc-9cc008d42ed1"

[vars]
# Origins allowed to call the API. The lab's own Pages origin plus the vite dev
# server. ADMIN_TOKEN is NOT here -- it is a secret, set with:
#   wrangler secret put ADMIN_TOKEN
ALLOWED_ORIGINS = "https://ysetbon.github.io,http://localhost:5173"
