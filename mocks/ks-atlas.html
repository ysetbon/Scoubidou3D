<!--
  Dev-only. Not a vite build input, so nothing here is published.

      npm run dev
      open http://localhost:5173/Scoubidou3D/mocks/ks-atlas.html

  The real /mxn/ks/ component against the committed dump in
  public/mxn/ks-atlas.json, with the live shelf switched off before it can be
  reached. So this is not a drawing of the page — it is the page, reading a
  snapshot instead of Cloudflare, which is why it can be trusted about how the
  live one behaves.

  Refresh the snapshot from a real Worker:

      npm run dump:ks -- --url https://mxn-solutions-api.ysetbon.workers.dev

  or, on a machine with no Worker, from the engine itself:

      python3 scripts/ks-fixtures.py
      npm run dump:ks -- --from node_modules/.cache/ks-raw
-->
