<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="880" height="360" fill="#f4f6f9"/>

  <text x="440" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#46505f">The “New level” button in the layer panel</text>

  <!-- ============ before ============ -->
  <rect x="32" y="60" width="252" height="184" rx="12" fill="#ffffff" stroke="#d7dde5"/>
  <text x="48" y="86" font-size="11" font-weight="700" letter-spacing="0.6" fill="#6a7686">LAYERS  (TOP = FRONT)</text>

  <!-- the new button -->
  <rect x="48" y="98" width="220" height="34" rx="8" fill="#f4f6f9" stroke="#c3ccd8"/>
  <g transform="translate(62,105) scale(0.83)" fill="#46505f">
    <path d="M12 3 22 9.2 12 15.4 2 9.2Z"/>
    <path d="M12 17.7 3.7 12.5 2 13.6 12 19.8 22 13.6 20.3 12.5Z"/>
  </g>
  <text x="92" y="120" font-size="13" font-weight="600" fill="#1d2530">New level</text>

  <!-- existing strand rows -->
  <rect x="48" y="144" width="220" height="34" rx="8" fill="#fbfcfe" stroke="#e3e8ef"/>
  <rect x="56" y="150" width="22" height="22" rx="5" fill="#f5c837" stroke="#c9ced6"/>
  <text x="88" y="166" font-size="13" font-weight="600" fill="#1d2530">1_2</text>
  <text x="260" y="166" text-anchor="end" font-size="11" fill="#9aa5b3">●  ▲  ▼  ✕</text>

  <rect x="48" y="186" width="220" height="34" rx="8" fill="#fbfcfe" stroke="#e3e8ef"/>
  <rect x="56" y="192" width="22" height="22" rx="5" fill="#e27a26" stroke="#c9ced6"/>
  <text x="88" y="208" font-size="13" font-weight="600" fill="#1d2530">1_1</text>
  <text x="260" y="208" text-anchor="end" font-size="11" fill="#9aa5b3">●  ▲  ▼  ✕</text>

  <text x="158" y="268" text-anchor="middle" font-size="12" fill="#6a7686">two strands, one level</text>

  <!-- ============ arrow ============ -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#9aa5b3"/>
    </marker>
  </defs>
  <path d="M300 150 h48" stroke="#9aa5b3" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="324" y="140" text-anchor="middle" font-size="11" fill="#6a7686">click</text>
  <text x="324" y="170" text-anchor="middle" font-size="11" fill="#6a7686">then</text>
  <text x="324" y="184" text-anchor="middle" font-size="11" fill="#6a7686">Add strand</text>

  <!-- ============ after ============ -->
  <rect x="368" y="60" width="252" height="226" rx="12" fill="#ffffff" stroke="#d7dde5"/>
  <text x="384" y="86" font-size="11" font-weight="700" letter-spacing="0.6" fill="#6a7686">LAYERS  (TOP = FRONT)</text>

  <!-- new strand, born above the level -->
  <rect x="384" y="98" width="220" height="34" rx="8" fill="#fbfcfe" stroke="#e3e8ef"/>
  <rect x="392" y="104" width="22" height="22" rx="5" fill="#3caaaf" stroke="#c9ced6"/>
  <text x="424" y="120" font-size="13" font-weight="600" fill="#1d2530">2_1</text>
  <rect x="454" y="107" width="34" height="15" rx="4" fill="#ffffff" stroke="#d7dde5"/>
  <text x="471" y="118" text-anchor="middle" font-size="9" fill="#6a7686">NEW</text>
  <text x="596" y="120" text-anchor="end" font-size="11" fill="#9aa5b3">●  ▲  ▼  ✕</text>

  <!-- the level row -->
  <rect x="384" y="140" width="220" height="34" rx="8" fill="#eaf2fd" stroke="#2f7bd6"/>
  <g transform="translate(392,146) scale(0.9)" fill="#2f7bd6">
    <path d="M12 3 22 9.2 12 15.4 2 9.2Z"/>
    <path d="M12 17.7 3.7 12.5 2 13.6 12 19.8 22 13.6 20.3 12.5Z"/>
  </g>
  <text x="424" y="162" font-size="13" font-weight="600" fill="#1d2530">level 1</text>
  <rect x="474" y="149" width="86" height="16" rx="4" fill="#ffffff" stroke="#b9d3f2"/>
  <text x="517" y="161" text-anchor="middle" font-size="9" fill="#2f7bd6">+1 THICKNESS</text>
  <text x="596" y="162" text-anchor="end" font-size="11" fill="#9aa5b3">▲  ▼  ✕</text>

  <rect x="384" y="182" width="220" height="34" rx="8" fill="#fbfcfe" stroke="#e3e8ef"/>
  <rect x="392" y="188" width="22" height="22" rx="5" fill="#f5c837" stroke="#c9ced6"/>
  <text x="424" y="204" font-size="13" font-weight="600" fill="#1d2530">1_2</text>
  <text x="596" y="204" text-anchor="end" font-size="11" fill="#9aa5b3">●  ▲  ▼  ✕</text>

  <rect x="384" y="224" width="220" height="34" rx="8" fill="#fbfcfe" stroke="#e3e8ef"/>
  <rect x="392" y="230" width="22" height="22" rx="5" fill="#e27a26" stroke="#c9ced6"/>
  <text x="424" y="246" font-size="13" font-weight="600" fill="#1d2530">1_1</text>
  <text x="596" y="246" text-anchor="end" font-size="11" fill="#9aa5b3">●  ▲  ▼  ✕</text>

  <!-- brackets -->
  <path d="M636 100 h10 v30 h-10" stroke="#2f7bd6" stroke-width="1.5" fill="none"/>
  <text x="654" y="119" font-size="11" fill="#2f7bd6">one thickness higher</text>
  <path d="M636 184 h10 v72 h-10" stroke="#9aa5b3" stroke-width="1.5" fill="none"/>
  <text x="654" y="224" font-size="11" fill="#6a7686">unchanged</text>

  <text x="494" y="310" text-anchor="middle" font-size="12" fill="#6a7686">the level row is added at the top, so everything you add next lands above it</text>
</svg>
