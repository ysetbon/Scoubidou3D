<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="880" height="430" fill="#f4f6f9"/>

  <text x="440" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#46505f">OpenStrand Studio's control marks, and when each one appears</text>

  <defs>
    <marker id="tip" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#9aa5b3"/>
    </marker>
  </defs>

  <!-- ================= state 1: untouched ================= -->
  <rect x="30" y="64" width="250" height="200" rx="12" fill="#ffffff" stroke="#d7dde5"/>
  <text x="155" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#46505f">Untouched</text>

  <!-- strand -->
  <rect x="62" y="160" width="186" height="26" rx="7" fill="#e27a26" stroke="#1e1e1e" stroke-width="1"/>
  <!-- start dot -->
  <circle cx="62" cy="173" r="7" fill="#2f7bd6" stroke="#1e1e1e" stroke-width="0.8"/>
  <circle cx="248" cy="173" r="7" fill="#2f7bd6" stroke="#1e1e1e" stroke-width="0.8"/>
  <!-- triangle on the start -->
  <path d="M62 158 74 179 50 179Z" fill="#008000" stroke="#1e1e1e" stroke-width="1"/>
  <path d="M62 168 68 178 56 178Z" fill="#e27a26"/>

  <text x="155" y="214" text-anchor="middle" font-size="11" fill="#6a7686">only the TRIANGLE, parked on the start</text>
  <text x="155" y="230" text-anchor="middle" font-size="11" fill="#6a7686">(both control points live there — the</text>
  <text x="155" y="245" text-anchor="middle" font-size="11" fill="#6a7686">strand reads as a straight line)</text>

  <path d="M292 164 h44" stroke="#9aa5b3" stroke-width="2" fill="none" marker-end="url(#tip)"/>
  <text x="314" y="154" text-anchor="middle" font-size="11" fill="#6a7686">pull it</text>

  <!-- ================= state 2: open ================= -->
  <rect x="348" y="64" width="290" height="200" rx="12" fill="#ffffff" stroke="#d7dde5"/>
  <text x="493" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#46505f">Bent — the set opens</text>

  <path d="M378 186 C 410 110, 470 210, 610 168" stroke="#e27a26" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M378 186 C 410 110, 470 210, 610 168" stroke="#1e1e1e" stroke-width="27" fill="none" stroke-linecap="round" opacity="0.18"/>

  <!-- dashed rig -->
  <g stroke="#008000" stroke-width="1" stroke-dasharray="5 4" fill="none">
    <path d="M378 186 L 430 118"/>
    <path d="M610 168 L 546 214"/>
    <path d="M488 166 L 430 118"/>
    <path d="M488 166 L 546 214"/>
  </g>

  <!-- endpoints -->
  <circle cx="378" cy="186" r="7" fill="#2f7bd6" stroke="#1e1e1e" stroke-width="0.8"/>
  <circle cx="610" cy="168" r="7" fill="#2f7bd6" stroke="#1e1e1e" stroke-width="0.8"/>

  <!-- triangle (cp1) -->
  <path d="M430 106 442 127 418 127Z" fill="#008000" stroke="#1e1e1e" stroke-width="1"/>
  <path d="M430 116 436 126 424 126Z" fill="#e27a26"/>
  <!-- circle (cp2) -->
  <circle cx="546" cy="214" r="11" fill="#008000" stroke="#1e1e1e" stroke-width="1"/>
  <circle cx="546" cy="214" r="5" fill="#e27a26"/>
  <!-- square (centre) -->
  <rect x="478" y="156" width="20" height="20" fill="#008000" stroke="#1e1e1e" stroke-width="1"/>
  <rect x="483" y="161" width="10" height="10" fill="#e27a26"/>

  <text x="493" y="238" text-anchor="middle" font-size="11" fill="#6a7686">the CIRCLE (far handle) and the SQUARE (middle)</text>
  <text x="493" y="253" text-anchor="middle" font-size="11" fill="#6a7686">join in, linked by the dashed green rig</text>

  <path d="M650 164 h44" stroke="#9aa5b3" stroke-width="2" fill="none" marker-end="url(#tip)"/>
  <text x="672" y="154" text-anchor="middle" font-size="11" fill="#6a7686">all home</text>

  <!-- ================= state 3: folded ================= -->
  <rect x="706" y="64" width="144" height="200" rx="12" fill="#ffffff" stroke="#d7dde5"/>
  <text x="778" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#46505f">Folded away</text>
  <rect x="726" y="160" width="106" height="26" rx="7" fill="#e27a26" stroke="#1e1e1e" stroke-width="1"/>
  <circle cx="726" cy="173" r="7" fill="#2f7bd6" stroke="#1e1e1e" stroke-width="0.8"/>
  <circle cx="832" cy="173" r="7" fill="#2f7bd6" stroke="#1e1e1e" stroke-width="0.8"/>
  <path d="M726 158 738 179 714 179Z" fill="#008000" stroke="#1e1e1e" stroke-width="1"/>
  <path d="M726 168 732 178 720 178Z" fill="#e27a26"/>
  <text x="778" y="214" text-anchor="middle" font-size="11" fill="#6a7686">back to untouched,</text>
  <text x="778" y="229" text-anchor="middle" font-size="11" fill="#6a7686">back to one mark</text>

  <!-- ================= legend ================= -->
  <rect x="30" y="292" width="820" height="112" rx="12" fill="#ffffff" stroke="#d7dde5"/>

  <path d="M76 306 88 327 64 327Z" fill="#008000" stroke="#1e1e1e" stroke-width="1"/>
  <path d="M76 316 82 326 70 326Z" fill="#e27a26"/>
  <text x="104" y="317" font-size="12" font-weight="700" fill="#1d2530">Triangle</text>
  <text x="104" y="333" font-size="11" fill="#6a7686">control point 1 · always offered · pulling it opens the set</text>

  <circle cx="76" cy="366" r="11" fill="#008000" stroke="#1e1e1e" stroke-width="1"/>
  <circle cx="76" cy="366" r="5" fill="#e27a26"/>
  <text x="104" y="362" font-size="12" font-weight="700" fill="#1d2530">Circle</text>
  <text x="104" y="378" font-size="11" fill="#6a7686">control point 2 · rides with the end until you pull it off, then it's independent</text>

  <rect x="500" y="306" width="20" height="20" fill="#008000" stroke="#1e1e1e" stroke-width="1"/>
  <rect x="505" y="311" width="10" height="10" fill="#e27a26"/>
  <text x="532" y="317" font-size="12" font-weight="700" fill="#1d2530">Square</text>
  <text x="532" y="333" font-size="11" fill="#6a7686">the centre · tracks the midpoint until dragged, then locks and bends the curve</text>

  <circle cx="510" cy="366" r="7" fill="#2f7bd6" stroke="#1e1e1e" stroke-width="0.8"/>
  <text x="532" y="362" font-size="12" font-weight="700" fill="#1d2530">Blue dot</text>
  <text x="532" y="378" font-size="11" fill="#6a7686">start / end · drags the whole junction; control marks win where they overlap</text>
</svg>
