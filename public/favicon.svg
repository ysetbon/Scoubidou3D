<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Two laces crossing, the yellow one physically over the orange one:
       the project's whole idea, at 16 pixels. -->
  <rect width="64" height="64" rx="14" fill="#141a22"/>
  <g stroke="#141a22" stroke-width="3">
    <rect x="4" y="34" width="56" height="16" rx="5" fill="#c96a1f"/>
    <rect x="4" y="26" width="56" height="16" rx="5" fill="#e27a26"/>
    <rect x="24" y="6" width="16" height="52" rx="5" fill="#cba21f"/>
    <rect x="24" y="2" width="16" height="52" rx="5" fill="#f5c837"/>
  </g>
</svg>
