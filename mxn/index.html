<style>
  /* The lab paints its own background; this only stops a white flash in the
     moment before its stylesheet and bundle arrive. Same value as --paper. */
  html { background: #f4f0e6; }
</style>
</head>
<body>
  <!-- data-cache is the Worker /mxn/gpu/ precomputes onto (docs/mxn-farm.md).
       Filled in deliberately — the one address the operator commits on purpose
       (docs/gpu-runbook.md): with it, the fast path is on for every visitor,
       and a size that costs twenty seconds of blank page becomes one fetch.
       The URL only names the deployment; reads are public, writes need the
       token, which is never committed. If the Worker is ever gone, the lab
       falls back to computing locally exactly as it did before. -->
  <div id="lab" data-cache="https://mxn-solutions-api.ysetbon.workers.dev"></div>
  <script type="module" src="../src/mxn-lab/main.tsx"></script>
</body>
